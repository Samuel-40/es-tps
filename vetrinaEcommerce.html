<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewSofa - Vetrina</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f1ea; color: #111111; display: flex; min-height: 100vh; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .main-container { display: flex; width: 100%; animation: fadeIn 0.6s ease-out forwards; }
        
        .navbar { width: 250px; background-color: #111111; color: #ffffff; padding: 40px 20px; display: flex; flex-direction: column; gap: 25px; position: fixed; height: 100vh; z-index: 10; }
        .navbar h1 { color: #d4af37; font-size: 24px; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        .navbar a { color: #cccccc; text-decoration: none; font-size: 16px; transition: all 0.3s ease; padding: 10px 5px; border-left: 3px solid transparent; }
        .navbar a:hover, .navbar a.active { color: #d4af37; border-left: 3px solid #d4af37; padding-left: 12px; }
        .cart-badge { background-color: #d4af37; color: #111111; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-left: 5px; }
        
        .content-wrapper { margin-left: 250px; padding: 40px; width: calc(100% - 250px); }
        .header-vetrina { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #e0dacb; padding-bottom: 20px; }
        .header-vetrina h2 { font-size: 28px; text-transform: uppercase; letter-spacing: 1px; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        
        .product-card { background-color: #ffffff; border: 1px solid #e0dacb; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        
        .product-img { width: 100%; height: 200px; object-fit: cover; background-color: #faf9f6; border-bottom: 1px solid #e0dacb; }
        
        .product-info { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .product-brand { font-size: 12px; text-transform: uppercase; color: #aa8c2c; font-weight: bold; margin-bottom: 5px; }
        .product-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #111111; }
        .product-desc { font-size: 14px; color: #555555; line-height: 1.5; margin-bottom: 15px; flex: 1; }
        
        .product-specs { background-color: #faf9f6; padding: 10px; border-radius: 4px; font-size: 13px; margin-bottom: 15px; border-left: 3px solid #d4af37; }
        .product-specs div { margin-bottom: 4px; color: #333333; }
        
        .product-price { font-size: 20px; font-weight: bold; color: #111111; margin-bottom: 15px; text-align: right; }
        
        .btn-gold { background-color: #d4af37; color: #111111; border: none; padding: 12px; font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer; width: 100%; transition: all 0.3s; border-radius: 4px; }
        .btn-gold:hover { background-color: #aa8c2c; }
        
        .logout-btn { background: none; border: 1px solid #111111; color: #111111; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .logout-btn:hover { background-color: #111111; color: #ffffff; }
    </style>
</head>
<body>

    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert("Accesso negato! Effettua prima il login o la registrazione.");
            window.location.href = "registrazioneEcommerce.html";
        }
    </script>

    <div class="main-container">
        <nav class="navbar">
            <h1>NewSofa</h1>
            <a href="registrazioneEcommerce.html">Registrazione</a>
            <a href="loginEcommerce.html">Accedi</a>
            <a href="vetrinaEcommerce.html" class="active">Vetrina</a>
            <a href="carrelloEcommerce.html">Carrello <span id="cart-count" class="cart-badge">0</span></a>
        </nav>

        <div class="content-wrapper">
            <header class="header-vetrina">
                <h2>I Nostri Estratti di Design</h2>
                <button class="logout-btn" onclick="effettuaLogout()">Disconnetti</button>
            </header>

            <div class="products-grid" id="grigliaProdotti"></div>
        </div>
    </div>

    <script>
        let carrello = JSON.parse(localStorage.getItem('carrello')) || [];
        function aggiornaContatoreCarrello() {
            document.getElementById('cart-count').innerText = carrello.length;
        }
        aggiornaContatoreCarrello();

        function caricaProdottiArray() {
            const prodotti = [
                {
                    nome: "Divano Pyrite",
                    marca: "NewSofa",
                    descrizione: "Design geometrico con inserti dorati cangianti.",
                    immagine: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=500",
                    prezzo: 1200,
                    dimensioni: "220x95x80 cm",
                    taglia: "3 Posti",
                    spedizione: "Gratuita"
                },
                {
                    nome: "Sofà Quartz",
                    marca: "NewSofa",
                    descrizione: "Tessuto grezzo estratto ad alta resistenza color argilla.",
                    immagine: "https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?w=500",
                    prezzo: 850,
                    dimensioni: "180x90x75 cm",
                    taglia: "2 Posti",
                    spedizione: "29.00€"
                },
                {
                    nome: "Angolare Clay",
                    marca: "NewSofa",
                    descrizione: "Struttura imponente nei toni caldi della terra cotta.",
                    immagine: "https://images.unsplash.com/photo-1540518614846-7eded433c457?w=500",
                    prezzo: 2100,
                    dimensioni: "300x200x85 cm",
                    taglia: "Chise Longue",
                    spedizione: "Gratuita"
                }
            ];

            const griglia = document.getElementById('grigliaProdotti');
            
            prodotti.forEach(prodotto => {
                const cardHtml = `
                    <div class="product-card">
                        <img src="${prodotto.immagine}" alt="${prodotto.nome}" class="product-img">
                        <div class="product-info">
                            <span class="product-brand">${prodotto.marca}</span>
                            <h3 class="product-title">${prodotto.nome}</h3>
                            <p class="product-desc">${prodotto.descrizione}</p>
                            
                            <div class="product-specs">
                                <div><strong>Dimens.:</strong> ${prodotto.dimensioni}</div>
                                <div><strong>Taglia:</strong> ${prodotto.taglia}</div>
                                <div><strong>Spedizione:</strong> ${prodotto.spedizione}</div>
                            </div>
                            
                            <div class="product-price">€${prodotto.prezzo}</div>
                            <button class="btn-gold" onclick="aggiungiAlCarrello('${prodotto.nome.replace(/'/g, "\\'")}', ${prodotto.prezzo})">Aggiungi al Carrello</button>
                        </div>
                    </div>
                `;
                griglia.innerHTML += cardHtml;
            });
        }

        function aggiungiAlCarrello(nome, prezzo) {
            const item = { nome: nome, prezzo: parseFloat(prezzo) };
            carrello.push(item);
            localStorage.setItem('carrello', JSON.stringify(carrello));
            aggiornaContatoreCarrello();
            alert(`${nome} inserito nel carrello!`);
        }

        function effettuaLogout() {
            localStorage.removeItem('isLoggedIn');
            window.location.href = "loginEcommerce.html";
        }

        caricaProdottiArray();
    </script>
</body>
</html>

</body>
</html>
