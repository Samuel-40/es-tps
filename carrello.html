
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carrello - BlackRoom</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, Helvetica, sans-serif; }
  body { background-image: url('pattern.png'); background-repeat: repeat; background-position: center top; background-color: #0b3d1a; background-blend-mode: multiply; color: white; min-height: 100vh; }
  header { background: #000; height: 70px; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid #d4af37; margin-bottom: 30px; }
  h1 { color: #d4af37; }
  #lista-carrello { border: 3px solid #d4af37; border-radius: 10px; padding: 15px; max-width: 600px; margin: 0 auto; background: #000; }
  .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; padding: 8px 0; }
  .item:last-child { border-bottom: none; }
  .nome { font-weight: bold; font-size: 1.1rem; flex: 2; text-align: left; }
  .prezzo { color: #c0392b; margin-right: 15px; flex: 1; text-align: right; }
  button { background: #d4af37; border: none; padding: 5px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease; }
  button:hover { background: white; color: black; }
  .totale { text-align: right; font-weight: bold; font-size: 1.3rem; margin-top: 15px; color: #d4af37; max-width: 600px; margin-left: auto; margin-right: auto; }
  .checkout-container { text-align: center; margin-top: 25px; }
  .checkout-btn { background: #d4af37; color: black; border: none; padding: 12px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; transition: transform 0.3s ease; }
  .checkout-btn:hover { transform: scale(1.15); }
  a.home-link { display: block; text-align: center; margin-top: 25px; color: white; text-decoration: underline; font-weight: bold; }
  a.home-link:hover { color: #d4af37; }
</style>
</head>

<body>

<header>
  <h1>Carrello BlackRoom</h1>
</header>

<div id="lista-carrello"></div>

<div class="totale" id="totale">Totale: €0.00</div>

<div class="checkout-container">
  <button class="checkout-btn" onclick="window.location.href='checkout.html'">CHECKOUT</button>
</div>

<a href="index.html" class="home-link">Torna alla pagina principale</a>

<script>
  let carrello = JSON.parse(localStorage.getItem("carrello")) || [];

  function aggiornaCarrello() {
    const lista = document.getElementById("lista-carrello");
    lista.innerHTML = "";
    let totale = 0;

    if(carrello.length === 0){
      lista.innerHTML = "<p>Il carrello è vuoto.</p>";
      document.getElementById("totale").textContent = "Totale: €0.00";
      return;
    }

    carrello.forEach((item, i) => {
      totale += item.prezzo;

      const div = document.createElement("div");
      div.className = "item";

      const nome = document.createElement("div");
      nome.className = "nome";
      nome.textContent = item.nome;

      const prezzo = document.createElement("div");
      prezzo.className = "prezzo";
      prezzo.textContent = `€${item.prezzo.toFixed(2)}`;

      const btn = document.createElement("button");
      btn.textContent = "Rimuovi";
      btn.onclick = () => {
        carrello.splice(i, 1);
        localStorage.setItem("carrello", JSON.stringify(carrello));
        aggiornaCarrello();
      };

      div.appendChild(nome);
      div.appendChild(prezzo);
      div.appendChild(btn);
      lista.appendChild(div);
    });

    document.getElementById("totale").textContent = `Totale: €${totale.toFixed(2)}`;
  }

  aggiornaCarrello();
</script>

</body>
</html>
