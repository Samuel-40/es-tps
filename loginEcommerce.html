<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Login - NewExpedetion Cards</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#1f1f1f;
color:white;
overflow:hidden;
}

.container{
display:flex;
height:100vh;
animation:fadeIn 1s ease;
}

.sidebar{
width:220px;
background:#2b2b2b;
padding:30px;
border-right:3px solid #c9a227;
}

.logo{
font-size:28px;
color:#c9a227;
margin-bottom:40px;
}

.sidebar ul{
list-style:none;
}

.sidebar li{
margin:20px 0;
}

.sidebar a{
text-decoration:none;
color:white;
}

.center{
width:35%;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

.form-box{
width:100%;
background:#2d2d2d;
padding:40px;
border-radius:15px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:8px;
background:#444;
color:white;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#c9a227;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.right{
flex:1;
padding:60px;
display:flex;
justify-content:center;
flex-direction:column;
}

.right h1{
color:#c9a227;
margin-bottom:20px;
}

.right ul{
line-height:2;
}

@keyframes fadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<div class="logo">NewExpedetion Cards</div>

<ul>
<li><a href="registrazioneEcommerce.html">Registrazione</a></li>
<li><a href="loginEcommerce.html">Login</a></li>
<li><a href="vetrinaEcommerce.html">Vetrina</a></li>
<li><a href="carrelloEcommerce.html">Carrello</a></li>
</ul>

</div>

<div class="center">

<div class="form-box">

<h2>Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Accedi</button>

</div>

</div>

<div class="right">

<h1>Area Riservata Cards</h1>

<ul>
<li>✔ Accesso ai mazzi esclusivi</li>
<li>✔ Offerte premium</li>
<li>✔ Collezioni limitate</li>
<li>✔ Spedizioni rapide</li>
</ul>

</div>

</div>

<script>

function login(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

let utente = JSON.parse(localStorage.getItem("utente"));

if(utente.email === email && utente.password === password){

localStorage.setItem("isLoggedIn", true);

window.location.href = "vetrinaEcommerce.html";

}else{

alert("Credenziali errate.");

}

}

</script>

</body>
</html>
