<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrello</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f4f4f4;
}

.container{
display:flex;
min-height:100vh;
}

.sidebar{
width:220px;
background:#111;
padding:30px 20px;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
margin-bottom:40px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:15px;
margin-bottom:10px;
border-radius:8px;
transition:0.3s;
}

.sidebar a:hover{
background:#333;
}

.content{
flex:1;
display:flex;
padding:40px;
gap:30px;
animation:fadeIn 1s ease;
}

.products-list{
flex:2;
background:white;
border-radius:15px;
padding:30px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.product{
border-bottom:1px solid #ddd;
padding:15px 0;
}

.summary{
width:300px;
background:white;
border-radius:15px;
padding:30px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
height:fit-content;
}

.total{
font-size:28px;
font-weight:bold;
margin:20px 0;
}

button{
width:100%;
padding:14px;
background:black;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#333;
}

@keyframes fadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}

</style>
</head>
<body>

<script>

if(localStorage.getItem("isLoggedIn") !== "true"){
window.location.href = "registrazioneEcommerce.html";
}

</script>

<div class="container">

<div class="sidebar">

<div class="logo">NewExpedition</div>

<a href="registrazioneEcommerce.html">Registrazione</a>
<a href="loginEcommerce.html">Login</a>
<a href="vetrinaEcommerce.html">Vetrina</a>
<a href="carrelloEcommerce.html">Carrello</a>

</div>

<div class="content">

<div class="products-list" id="productsList">

<h2>Prodotti nel carrello</h2>

</div>

<div class="summary">

<h2>Riepilogo</h2>

<div class="total">
Totale: € <span id="totale">0</span>
</div>

<button onclick="generaPDF()">Scarica PDF</button>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

let carrello = JSON.parse(localStorage.getItem("carrello")) || [];

let utente = JSON.parse(localStorage.getItem("utente"));

let lista = document.getElementById("productsList");

let totale = 0;

carrello.forEach(prodotto => {

totale += parseFloat(prodotto.prezzo);

let div = document.createElement("div");

div.classList.add("product");

div.innerHTML = `

<h3>${prodotto.nome}</h3>

<p>Marca: ${prodotto.marca}</p>

<p>Taglia: ${prodotto.taglia}</p>

<p>Prezzo: € ${prodotto.prezzo}</p>

`;

lista.appendChild(div);

});

document.getElementById("totale").innerText = totale.toFixed(2);

function generaPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

doc.setFont("courier");

doc.setFontSize(18);

doc.text("NEWEXPEDITION", 20, 20);

doc.setFontSize(12);

let data = new Date();

doc.text("Data: " + data.toLocaleDateString(), 20, 35);

doc.text("Cliente: " + utente.nome + " " + utente.cognome, 20, 45);

doc.text("--------------------------------", 20, 55);

let y = 70;

carrello.forEach(prodotto => {

doc.text(
prodotto.nome + " - € " + prodotto.prezzo,
20,
y
);

y += 10;

});

doc.text("--------------------------------", 20, y);

y += 15;

doc.setFontSize(16);

doc.text("TOTALE: € " + totale.toFixed(2), 20, y);

doc.save("scontrino.pdf");

}

</script>

</body>
</html>
